name: Build

on:
  pull_request:
    branches: [master]
    paths-ignore: &skip
      - 'http_data/**'
      - '**.md'
      - 'README*'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches: [master]
    paths-ignore: *skip
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A merged PR gets a new commit SHA but, when master hasn't moved since the
  # PR was tested, the same tree as the merge the PR run built. Every run that
  # passes records its tree as an artifact, and a push whose tree is recorded
  # skips the builds. Pull requests can upload artifacts of any name, so only a
  # push skips, and only on a record made by a run of this repository or of a
  # commit the push merged.
  check:
    name: Already tested?
    runs-on: ubuntu-24.04
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"; then
            echo "::warning::Could not look up the tree of ${GITHUB_SHA}, building anyway"
            exit 0
          fi
          tree="$(jq -r .commit.tree.sha <<< "${commit}")"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          if [ "${EVENT}" != push ]; then
            echo "Building tree \`${tree}\`; only pushes skip a tree that already passed." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # The heads this push merged: every parent but the first
          merged="$(jq -c '[.parents[1:][].sha]' <<< "${commit}")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tested-tree-${tree}" |
            jq -r --argjson merged "${merged}" '[.artifacts[] | select(.expired | not)
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id
                or (.workflow_run.head_sha as $h | any($merged[]; . == $h)))][0].workflow_run.id // empty')" || run=
          if [ -n "${run}" ]; then
            echo "tested=true" >> "${GITHUB_OUTPUT}"
            echo "Tree \`${tree}\` already passed every build in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}, skipping the builds." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Tree \`${tree}\` has not passed in a run this push can trust, building." >> "${GITHUB_STEP_SUMMARY}"
          fi

  build:
    name: ${{ matrix.distro.name }} / ${{ matrix.build }}
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: Alpine, image: build-alpine-amd64 }
          - { name: Ubuntu 24.04, image: build-ubuntu-noble-amd64 }
          - { name: Ubuntu 26.04, image: build-ubuntu-resolute-amd64 }
        build: [default, all, all-no-wext]
    env:
      # Forks have no images of their own, so always use upstream's.
      IMAGE: ghcr.io/kismetwireless/kismet/${{ matrix.distro.image }}:latest
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mac80211_hwsim and hostapd
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y iw rfkill hostapd tcpdump
          sudo systemctl stop hostapd.service || true
          sudo systemctl mask hostapd.service || true
          if ! modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          fi
          if ! modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
            "${GITHUB_WORKSPACE}/.github/ci/build_mac80211_hwsim.sh" "${RUNNER_TEMP}"
            sudo install -D -m 644 "${RUNNER_TEMP}/mac80211_hwsim.ko" "/lib/modules/$(uname -r)/updates/mac80211_hwsim.ko"
            sudo depmod -a
          fi
          if ! sudo modprobe mac80211_hwsim radios=2; then
            echo "::error::mac80211_hwsim can't be loaded on this runner (kernel $(uname -r)), so kismet can't be run"
            sudo dmesg | tail -n 5
            exit 1
          fi
          sudo modprobe -r mac80211_hwsim

      - name: Pull the ${{ matrix.distro.name }} image
        run: docker pull "${IMAGE}"

      - name: Build (${{ matrix.build }})
        run: |
          echo "::add-matcher::.github/ci/gcc-matcher.json"
          docker run --name kismet-build \
            -v "${GITHUB_WORKSPACE}:/github/workspace" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            --entrypoint "/${BUILD}-build.sh" \
            "${IMAGE}"
          docker commit kismet-build kismet-ci:build
          docker rm kismet-build

      - name: Run kismet on 50 hwsim radios
        env:
          LOGDIR: ${{ runner.temp }}/kismet-runtime
        run: sudo --preserve-env=LOGDIR,GITHUB_STEP_SUMMARY .github/ci/runtime-test.sh kismet-ci:build

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtime-${{ matrix.distro.image }}-${{ matrix.build }}
          path: ${{ runner.temp }}/kismet-runtime
          if-no-files-found: ignore

  selftest:
    name: CI self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci
      - run: .github/ci/selftest.sh

  result:
    name: All builds
    needs: [check, build, selftest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build.result != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci

      - name: Summarize
        if: needs.build.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[]' |
            jq -rs -f .github/ci/build-summary.jq >> "${GITHUB_STEP_SUMMARY}"

      - name: Record the tree as tested
        if: needs.build.result == 'success' && needs.selftest.result == 'success' && needs.check.outputs.tree != ''
        env:
          TREE: ${{ needs.check.outputs.tree }}
        run: echo "${TREE}" > tested-tree

      - if: needs.build.result == 'success' && needs.selftest.result == 'success' && needs.check.outputs.tree != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tested-tree-${{ needs.check.outputs.tree }}
          path: tested-tree

      - name: Check every build passed
        if: needs.check.result != 'success' || needs.selftest.result != 'success' || (needs.build.result != 'success' && needs.build.result != 'skipped')
        env:
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
          SELFTEST: ${{ needs.selftest.result }}
        run: |
          echo "::error::Builds did not all pass (check: ${CHECK}, builds: ${BUILD}, self-test: ${SELFTEST})"
          exit 1
