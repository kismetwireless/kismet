# Baseline configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# The baseline is the devices you know: the ones tagged "baseline", by "Add to baseline"
# in the web UI's device details or by the baseline filters.  The rules that make the
# Baseline devices and Unknown devices views, leave the baseline out of the Default view
# and highlight it, and the shipped baseline filters, are in kismet_baseline_rules.txt,
# which is read with the other device rules files (see kismet_device_rules.conf).

# Run the baseline filters ('baseline' blocks in the rules files), and record the days
# each device is seen for days_active.  Off by default: the filters change which devices
# are in the baseline on their own.  Recording days adds a small record to each device.
# Each filter run reads every device; see 'every' in kismet_baseline_rules.txt.
#
# device_rules_baseline=false

# Most devices one baseline filter adds or removes in one run; the rest wait for its
# next run.  Keeps a filter written too broadly from changing the whole baseline at
# once, and bounds the database writes of a run.  From 1 to 100000.
#
# device_rules_baseline_max_changes=1000

# Alert classes, comma separated, that don't count toward a device's own_alerts and
# own_alert_severity, which the shipped 'alerts' baseline filter reads.  Denial of
# service alerts name the address they claim to come from, which a spoofed
# deauthentication flood sets to its victim's, and system alerts aren't about a device.
#
# device_rules_alert_ignore_classes=DENIAL,SYSTEM

# A baseline filter on one line, written without its leading 'baseline'.  A filter with
# the same name as one in a rules file replaces it.
#
# device_baseline=quiet-sensors { when phy == "RFSENSOR" and days_active >= 3 every 1h add }

# Leave out a shipped baseline filter or rule by name.
#
# device_rule_disable=startup
