# 802.11-specific configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Only take AP signal level from beacons send from the AP; this helps prevent wild
# fluctuations in the signal level caused by different data rates.  Generally,
# leave this turned on
dot11_ap_signal_from_beacon=true


# Only track access point devices; this will discard all data packets and disable
# tracking of non-AP devices like clients, bridged wired devices, and probing
# clients.
dot11_ap_only_survey=false


# 802.11d is a now-deprecated country identifier in beacons that also includes
# a list of supported channels and channel power; the FCC mandates that 802.11d
# no longer be used, and maintaining the list of channels can be costly for 
# ram and CPU; if you want to process the channel list as well as the country name,
# turn this on
dot11_11d_country_full=false


# Kismet manages multiple views of the device data; one of these views is for 802.11 access
# points (and access-point-like devices which send probe responses).  This takes additional
# memory (though, a relatively small amount).  In very high access point environments, you
# might wish to turn off some or all of the additional views.
# If the access point view is turned off, access points WILL STILL BE TRACKED, there just
# won't be a dedicated view in the UI for them.
dot11_view_accesspoints=true

# Kismet manages a view of SSIDs independent of devices; in extremely high access point
# environments, you might wish to turn this off to save memory.  SSIDs will still be logged and
# associated with access points, but the content of the SSIDs tab will not be populated.
dot11_view_ssids=true

# Most SSID groups the SSIDs view keeps.  Past this, the least recently seen tenth
# are dropped, so a flood of fake beacons can't grow it forever.  0 disables the limit.
dot11_max_ssid_groups=10000

# Most advertised, responded and probed SSIDs kept per device, for each list, so a device
# answering for endless SSIDs (or forged frames from one address) can't grow it forever.
# When a list is full, the SSID seen longest ago makes room for a new one only if it hasn't
# been seen for 60 seconds.  Otherwise the new SSID is handled once (alerts, karma detection)
# but not kept: it doesn't appear in the device or the SSID view and sends no new SSID
# events.  An advertised or responded SSID left out is remembered and not handled again;
# a probed one, or one from an 802.11ah (S1G) device, is handled again each time it's seen.
# Once a device's advertised or responded list is full, the "advertising new SSID"
# messages stop for that device.  0 disables the limit.
dot11_max_device_ssids=128

# Karma / mana access point detection: raise the DOT11KARMA alert when a BSSID answers probe
# requests for networks it never advertises in broadcast beacons, as karma and mana attacks
# (such as the Wi-Fi Pineapple) do to lure clients.  Unicast beacons for a network don't
# count as advertising it.  It alerts once per BSSID when, within dot11_karma_window seconds
# (capture time), it answered for dot11_karma_min_matched networks that clients probed for
# within dot11_karma_probe_window seconds of the answer, or for dot11_karma_min_unbeaconed
# networks of any kind.  One network is allowed for when the BSSID beacons a hidden SSID
# (one at most, however many hidden SSIDs it beacons), and Wi-Fi Direct names, mesh networks
# and networks a related BSSID (multiple BSSID set, BSS timestamp) beacons don't count.
# It also alerts when one BSSID broadcast-beacons dot11_karma_min_pool different networks
# within dot11_karma_window seconds, as a karma AP beaconing a pool of SSIDs (PineAP) does;
# hidden SSIDs, Wi-Fi Direct and mesh networks don't count, and a network counts once it was
# beaconed in two different seconds.  A beacon flood (4 x dot11_karma_min_pool new networks a
# second from one BSSID) alerts too.  Networks a BSSID beaconing more than one answered for
# and also beacons are reported apart, and don't alert on their own.  Matching probes needs
# dot11_view_ssids.  The thresholds are 1 to 1024 (dot11_karma_min_pool 2 to 1024);
# dot11_karma_max_ssids networks are kept per BSSID, at least the largest threshold and at
# most 1024.  A pool beaconing more networks than that is counted from a sample of them, and
# its count is an estimate ("about N").  Known limits: a pool beaconing each network fewer
# than twice per dot11_karma_window, and below the flood rate, isn't detected; a pool smaller
# than dot11_karma_max_ssids mixed with a stream of random one-off networks can stay under
# dot11_karma_min_pool (its answers for networks clients probe for still alert); once a
# BSSID's pool is sampled, the flood count is an estimate, so a stream of one-off networks
# somewhat below the flood rate can raise the flood alert, and a long run of one-offs below
# the flood rate can hide a later flood; heavy SSID corruption from a source without FCS
# checks can look like a flood and raise the flood alert for a normal AP; and frame times aren't corrected for clock differences between sensors
# and the server, so a source whose clock runs far ahead holds the window of the BSSIDs it
# hears (times outside 1970 to 2100 count at the nearest end).
dot11_karma_detect=true
dot11_karma_min_matched=3
dot11_karma_min_unbeaconed=10
dot11_karma_min_pool=10
dot11_karma_window=600
dot11_karma_probe_window=60
dot11_karma_max_ssids=64

# Access points which legitimately answer for several SSIDs they don't beacon, such as old
# access points serving several hidden SSIDs from one BSSID, can be left out of karma
# detection.  A comma-separated list of MAC addresses or masks (AA:BB:CC:00:00:00/FF:FF:FF:00:00:00),
# on one or more lines; up to 256 are used.
# dot11_karma_ignore_bssids=00:00:5E:00:53:01,00:00:5E:00:53:02

# Keep a device view of suspected karma access points (phydot11_karma)
dot11_view_karma=true

# Enable device fingerprinting.  This is *required* to use the whitelisting features, but
# uses more RAM to store the fingerprints.
dot11_fingerprint_devices=true

# Access point fingerprinting is done in part by hashing IE tags to determine if
# they have changed.  Typically you shouldn't change this, but if you need to, you can change
# the IE tag numbers used to compute the hash here.  If you change this, you may invalidate any
# saved hashes in an existing whitelist.
#
# Fingerprinting is only available when dot11_fingerprint_devices=true
#
# IE221 is special, as it contains a number of sub-values.  These are indicated as
# 221-{Vendor OUI}-{Vendor Sub-Type}
#
# By default, Kismet considers:
# 0     SSID
# 1     Supported basic rates
# 45    HT capabilities
# 48    RSN advertisement
# 50    Extended supported rates
# 61    HT information
# 74    BSS scan capabilities
# 127   Extended capabilities
# 191   VHT capabilities
# 195   VHT PE
# 221   00:15:6D sub 0 Ubiquiti vendor specific data
# 221   00:50:F2 sub 2 Microsoft WMM/WME
# 221   00:10:18 sub 2 Broadcom vendor specific data
# 221   50:6F:9A sub 28 OWE transitional data
dot11_beacon_ie_fingerprint=0,1,45,48,50,61,74,127,191,195,221-00156D-00,221-0050F2-2,221-001018-2,221-506F9A-28

# Client device fingerprinting is done, in part, by hashing IE tags in the probe request.
# Typically you shouldn't need to change this, but if you need to, you can change the IE
# numbers used to compute the hash here.  If you change this, you may invalidate any saved
# hashes in an existing device whitelist.
#
# Fingerprinting is only available when dot11_fingerprint_devices=true
#
# IE221 is special as it contains a number of sub-values.  These are indicated as
# 221-{Vendor OUI}-{Vendor Sub-Type}
#
# By default, Kismet considers:
# 1     Supported basic rates
# 50    Extended supported rates
# 59    Supported operating classes
# 107   Internetworking
# 127   Extended capabilities
# 221   00:10:18 sub 2 Broadcom vendor specific data
# 221   00:90:4c sub 51 Epigram Pre-HT capabilities
dot11_probe_ie_fingerprint=1,50,59,107,127,221-001018-2,221-00904c-51


# Associate devices with similar BSSTS timestamps.  This can help find shared hardware like 
# multiple BSSIDs on the same AP, though it can also be tricked when many APs come online at 
# the same time, such as after a power outage. 
#
# Because this has to search the entire device list every time a new access point is found, 
# this can have significant performance impacts.  It is off by default, and may cause 
# disruption and dropped packets in environments with a large number of NEW APs, such as 
# when wardriving.
dot11_link_bssts=false

# Window of time for classifying an 802.11 AP as likely running on the same hardware based
# on BSSTS; in usec, the delta allowed for BSSTS.  
dot11_related_bss_window=10000000

# Link the randomized addresses a client cycles through (as phones do while scanning)
# into one group, by matching the fingerprint of its probe requests, their timing,
# and their sequence numbers.  Linked devices are related as dot11_randomized_alias
# and share dot11.device.alias_group.  This undoes some of the privacy address
# randomization gives, so it is off by default.
dot11_link_randomized=false

# Count control frames (RTS, CTS, ACK, block ACK, NDP announcement, PS-Poll) on the known
# devices they name, in dot11.device.ctrl_activity, and count on each AP the stations seen
# only in control frames with it (dot11.device.ctrl_only_stations), such as clients whose
# data is sent at a rate or stream count the capture can't decode.  Control frames never
# create devices unless dot11_infer_clients is on.  Most capture drivers don't pass control
# frames at all.
dot11_track_control=true

# Create a "Wi-Fi Client (Inferred)" device for a station seen only in control frames with
# a known AP, once it has been seen in dot11_infer_min_frames frames with a valid FCS over at
# least dot11_infer_min_seconds seconds.  Inferred clients are linked to the AP, and become
# normal clients if they're later seen directly.  Counts of waiting and inferred addresses
# are in /phy/phy80211/inferred_clients.  Needs dot11_track_control; off by default.
dot11_infer_clients=false
dot11_infer_min_frames=10
dot11_infer_min_seconds=10

# Count retried data and management frames per channel (kismet.channelrec.retry_* in
# /channels/channels.json) and flag channels that look noisy: many retries, from several
# transmitters, can mean interference Kismet can't decode.  Every
# dot11_channel_noise_window seconds a frequency's retry percentage is worked out with its
# worst transmitter left out, so one station retrying to a far-away peer doesn't mark the
# channel.  The score is that percentage, scaled down while fewer than
# dot11_channel_noise_min_frames frames or dot11_channel_noise_min_transmitters
# transmitters with 2 or more retries are heard.  A channel is flagged (and the CHANNOISE
# alert raised) when the score reaches dot11_channel_noise_retry_pct, and cleared when it
# falls under dot11_channel_noise_clear_pct.  Windows with too few frames leave the flag
# alone; it clears after dot11_channel_noise_hold seconds without a full window.  A hopping
# source hears each channel a fraction of the time, so it needs a longer window.  The usual
# retry level (noise_baseline_pct) learns only from windows that aren't flagged.
dot11_channel_noise=true
dot11_channel_noise_window=10
dot11_channel_noise_min_frames=50
dot11_channel_noise_min_transmitters=3
dot11_channel_noise_retry_pct=30
dot11_channel_noise_clear_pct=15
dot11_channel_noise_hold=60

# Keep a copy of the last set of IE tags as bytearrays in the ssid record; this can use significantly more ram
# per SSID so it is off by default.  The copy is refreshed when the tags change, but not when only the
# contents of the TIM (5) or the QBSS load (11) change, so those two tags may be older than the last beacon.
dot11_keep_ietags=false

# Keep a copy of EAPOL WPA handshake packets for an easy handshake pcap download and handshake replay
# alerts/WIDS.  This will take more memory, but is the default behavior.
dot11_keep_eapol=true

# Some special manufacturer fields
manuf=A2:09:24,WLAN Pi

