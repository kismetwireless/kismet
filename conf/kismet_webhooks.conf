# Webhook configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Webhooks send device rule matches to an HTTP server as JSON, such as a Home
# Assistant webhook automation.  Endpoints are defined here, in the config only;
# device rules name the endpoint they send to with a 'webhook' statement (see
# kismet_device_rules.txt).
#
#   webhook_endpoint=<name>:url=<url>[,option=value...]
#
# Secrets, headers and urls with tokens in them are readable by anyone who can
# read this file; this file is installed readable by all, so put endpoints in
# kismet_site.conf and make it readable only by the user Kismet runs as.
#
# Device names and other strings come from the air: receivers should treat every
# field of an event as untrusted text.
#
# Names are letters, digits, - and _.  Options:
#
#   url=<url>             http:// or https:// url to POST to.  Put credentials in a
#                         header, not in the url.  The path and query aren't shown in
#                         the logs or the status, since they often hold a secret.
#   secret=<text>         sign each call: X-Kismet-Timestamp is the send time, and
#                         X-Kismet-Signature is sha256=<hex HMAC-SHA256 of
#                         "<timestamp>.<body>" with the secret>.  Use 16 or more
#                         characters.  Receivers should check the signature and
#                         refuse old timestamps, so a captured call can't be replayed.
#   header="Name: value"  add a header, such as an Authorization header; up to 8
#   rate=<n>/<period>     most calls per period, such as 30/1m (default 30/1m)
#   burst=<n>             calls that may go at once before the rate applies (default 10)
#   queue=<n>             events waiting to send, oldest dropped first when full
#                         (default 200)
#   max_events=<n>        most events in one call (default 100)
#   timeout=<duration>    time for one call, from 1s to 60s (default 10s)
#   ca=<file>             PEM file of the certificate authorities to trust for https,
#                         instead of the system ones
#   insecure=true         don't check the https server's certificate
#
# Each call is one JSON object:
#
#   {"kismet": {"server_name": ..., "server_uuid": ..., "version": ...},
#    "endpoint": "<name>", "sent": <time>,
#    "dropped": <events dropped since the last delivered call>,
#    "suppressed": <events rate limits kept back since the last delivered call>,
#    "events": [ {"rule": ..., "description": ..., "trigger": ..., "time": ...,
#                 "seq": ..., "device": {...}, "changed": {...}} ] }
#
# A call that fails with no answer, a timeout, HTTP 408, 429 or 5xx is retried with
# a growing delay (Retry-After on a 429 or 503 is honored, up to an hour); each event
# is tried 3 times.
# Other answers drop the events in the call.
#
# Example:
#
# webhook_endpoint=ha:url=https://homeassistant.local:8123/api/webhook/kismet-events,secret=change-this-secret-text
# webhook_endpoint=log:url=http://127.0.0.1:8000/kismet,header="Authorization: Bearer abc123",rate=60/1m

# Most webhook events from every rule together, per period
# webhook_global_rate=600/1m

# Most devices each rule's webhook keeps state for ('for', 'change', 'every', 'new' and
# 'stop' need it); devices past this are skipped and counted in the status
# webhook_max_tracked=100000
