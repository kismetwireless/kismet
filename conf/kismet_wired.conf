# Wired (Ethernet, IEEE802.3) configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf
#
# Ethernet frames (DLT_EN10MB, and Linux cooked "any" captures) are read from pcap
# files and kismetdb logs, and captured live on Linux by the 'wired' datasource
# (kismet_cap_wired, below).  Devices are tracked by MAC address, and only a MAC
# sending a frame becomes a device; destinations only update devices already seen.
# The sensor's GPS position is never used as an Ethernet device's position.
#
# VLAN tags are seen in captures of a single interface (DLT_EN10MB).  On Linux the kernel
# strips the tag before the capture; libpcap puts it back for DLT_EN10MB interface
# captures, but captures of the "any" interface (Linux cooked SLL2) have been observed
# without their tags, so their VLANs are not shown.

# Live capture: the 'wired' datasource (Linux only)
#
#   source=eth0:type=wired
#   source=eth0:type=wired,name=uplink,snaplen=256,filter="not port 22"
#
# Ethernet interfaces only: loopback, Wi-Fi (use the linuxwifi source) and non-Ethernet
# interfaces such as tun are refused.  An interface given without type= is detected
# as wired when it is Ethernet.  Bridges, bonds, VLAN interfaces and veths are Ethernet
# to the kernel and can be captured.  Options:
#
#   mode=full        Every frame is sent to the server.  The only mode for now, and
#                    a source without mode= runs in full mode.  A later version adds a
#                    summary mode and will require mode=full to be given to keep
#                    sending every frame, so set it now on sources that need it.
#   snaplen=N        Bytes kept of each frame, 96 to 15872; default 1600.  A frame
#                    and its report must fit in one 16 KB message to the server, so
#                    jumbo frames past this are cut short.  A remote helper with a
#                    fixed GPS (--fixed-gps, --gps-name) sends the GPS name with every
#                    frame, so its maximum is 15872 less the name's length; smaller
#                    snaplen values are kept as given.
#   buffer_mb=N      Kernel capture buffer in MB, 1 to 1024; default 64.  Raise it when
#                    the source reports kernel drops.
#   promisc=BOOL     Promiscuous mode, true or false; default true.  Without it only
#                    frames to and from the sensor, and broadcast and multicast, are seen.
#   ifup=BOOL        Bring the interface up when it is down at open, true or false;
#                    default true.  Once up, the interface transmits: the kernel sends
#                    IPv6 link-local traffic and router solicitations, and a network
#                    manager which owns the interface may start DHCP on it.  It is
#                    never taken down again: it stays up when the source closes, as
#                    Wi-Fi sources leave theirs, and the source's messages say when it
#                    brought the interface up, failed opens included.  Only IFF_UP is
#                    changed.  This needs CAP_NET_ADMIN (see below); without it, or
#                    with ifup=false, opening a down interface fails, saying to run
#                    'ip link set eth0 up'.  ifup=false turns it off.  A link without
#                    a carrier yet (a USB adapter still negotiating) is fine; the
#                    carrier warning shows until it comes up.
#   filter="EXPR"    A libpcap (tcpdump) filter, in quotes, up to 1024 printable ASCII
#                    characters with balanced parentheses.  As in tcpdump, 'arp' or
#                    'udp' match untagged frames; add 'vlan and ...' or
#                    'or (vlan and ...)' for tagged frames.  'ip broadcast' uses the
#                    interface's IPv4 netmask, and needs the interface to have one.
#   sample=N         Send only the first frame of every N, 1 to 1000000; default 1.
#                    The source still counts every frame it saw.
#   uuid=UUID        A fixed source UUID; by default it comes from the interface name
#                    and MAC, so VLAN interfaces, bridges and bonds sharing a MAC with
#                    their parent each get their own.
#
# An option the source doesn't know (a misspelled one, say) is reported in the
# messages when the source opens, and otherwise ignored.
#
# kismet_cap_wired needs CAP_NET_RAW to capture, and CAP_NET_ADMIN only to bring a down
# interface up (ifup=); installs with the suid-root group set both as file
# capabilities (setcap cap_net_raw,cap_net_admin+ep).  'setcap cap_net_raw+ep' alone
# works for interfaces which are already up.  It is only built with libcap.  Before it
# connects to anything it hands CAP_NET_ADMIN to a small child process which can only
# set an Ethernet interface up, and which exits with the helper; the helper itself,
# and a --retry monitor, drop it.  The capture keeps only CAP_NET_RAW and drops every
# other capability, ambient ones included, and exits if it can't, saying why in the
# server's messages.  Started with root's uid or group (any real, effective or saved
# uid or gid 0, or a supplementary group 0), it starts no such child and brings no
# interface up.  Started as root, by a server running as root or as a setuid-root
# helper, it also stops being root before it captures: it switches to the
# user who started it, or to nobody (uid 65534) when that was root, keeping only
# CAP_NET_RAW, and exits if it can't.  Root without CAP_SETUID and CAP_SETGID (a
# container started with --cap-drop ALL --cap-add NET_RAW) can't switch, so run it
# there as a user with the file capability.
#
# A gid 0 or supplementary group 0 (root's group) is left the same way, and without
# CAP_SETGID to leave it the helper exits: run it without gid 0 or group 0.  That
# includes containers which run every process as an arbitrary uid with gid 0, as
# OpenShift does by default; give the helper's container another group (OpenShift's
# runAsGroup, or a security context constraint that allows one), or the file
# capability and a non-root group.
#
# In a user namespace other than the host's (a rootless or user-namespaced container),
# root or not, it checks what its ids are outside: it exits when its uid, gid or a
# supplementary group isn't mapped in the namespace or maps to id 0 of the parent
# namespace, which may be root's (as 'unshare -r' run by root maps 0 to 0), and when
# the kernel shows it to be root's further up a chain of namespaces.  It needs /proc
# for this, and exits without it.  Supplementary groups brought in from outside the
# namespace show as 65534 and might be root's group, so they are refused too; plain
# 'unshare -r' by a user with groups is refused for that reason, since it denies
# setgroups.  Start it from an account with no supplementary groups, or in a namespace
# made with newuidmap and newgidmap ('unshare --map-auto', rootless podman), where
# setgroups is allowed and the helper, as root of the namespace, clears them itself.
# Where it can't switch from root there (uid 65534 isn't mapped), it stays uid 0 of
# the namespace, with /proc/sys read-only to it where its filesystem jail works, and
# says so when the source opens.  Once its privileges are dropped it sets
# no_new_privs, so nothing it might run could gain any.
#
# The source list (--list, and the server's list of interfaces to add) holds at most
# 256 interfaces: NICs first, then bridges, bonds, VLANs and other virtual interfaces,
# then veth and tap interfaces, so a container or VM host's own NICs are always offered.
#
# As a remote capture (--connect), the helper leaves all TCP to and from the server's
# address and port out of the capture, so it doesn't capture its own frames to the
# server, or those of other helpers on the same sensor, and send them again in a loop.
# That covers untagged frames and frames behind up to three VLAN tags, whatever the
# filter= option says; other sensors' connections to the same server are left out too.
#
# It only knows the connection as the helper sees it.  Through an SSH forward
# (--connect to localhost), a VPN or another tunnel, the frames on the wire are the
# tunnel's, not the connection's, and are not left out; if the tunnel runs over the
# captured interface, every frame sent comes back as more tunnel traffic.  The same
# goes for policy-based IPsec, which encrypts the connection without an interface of
# its own, and for MACsec, VXLAN and other links carried over the captured interface.
#
# The helper looks at the interface holding the connection's own address.  It counts
# the connection as excluded (remote_excluded true) only when that is the captured
# interface or sits on it through VLANs (three tags at most), bridges, bonds, teams,
# macvlans or ipvlans.  It warns when the server is a loopback address or one of this
# host's own, when the interface is carried over the captured one in a way the
# exclusion can't match, when the address is on no interface or is a service
# address on lo, a dummy or a VRF interface, sent out wherever the routes say, and
# when more interfaces are stacked under it than it follows.  It notes it
# when the address is on another interface: that needs nothing for a second uplink,
# or for a route with a src address sending the connection out over the captured
# interface, as those frames are still left out.
#
# Leave a tunnel's traffic out with filter=, such as filter="not port 22" for SSH,
# the VPN's port, or "not esp" for IPsec, or capture another interface.  Uplinks over
# PPPoE, MPLS or other encapsulation the exclusion doesn't read are not left out
# either; filter them out the same way.
#
# NIC offloads change what is captured: GRO and LRO merge received frames into one large
# frame, TSO and GSO send large frames the wire never carries, and rx-vlan-filter can
# drop frames for VLANs the host isn't a member of.  The source lists the ones that are
# on (kismet.datasource.wired.offloads) and leaves them alone.  Merged frames only make
# packet counts run low, as flows, devices and dissected protocols stay right, so the
# source only warns for rx-vlan-filter on an interface which isn't promiscuous, where
# whole VLANs go missing.  Turn them off with 'ethtool -K eth0 gro off lro off' and so on;
# the list is read again every few seconds, so the warning goes once the offload is off,
# and it goes when the source closes or fails.
#
# Full mode sends frame contents, up to snaplen, to the server, and they are logged to
# pcap and kismetdb logs when packet logging is on.  Use a small snaplen (such as 128,
# headers only) or a filter where payloads should not be kept.

# Most Ethernet devices to track; 0 for no limit.  A MAC flood (macof and similar)
# sends from a new random MAC with every frame, so without a limit it can fill memory;
# the limit's job is bounding memory.  Each device takes about 17 to 20 KB, counting the
# common device record.
#
# Once reached, new MACs are counted (see /phy/ethernet/status/status.json) but not
# tracked, except that a MAC seen again replaces the oldest device which sent only a
# frame or two (up to 100 a second), so real hosts arriving during a simple flood of
# one frame per MAC still get tracked.  That is all eviction defends against: a flood
# sending three or more frames from each MAC, or unicasting to its own MACs, makes
# devices that are never evicted, and then new hosts aren't tracked until the flood's
# devices time out or the limit is raised.
wired_max_devices=16384

# New Ethernet devices allowed per second of capture time; 0 for no limit.  MACs past the
# rate are counted but don't make devices; a MAC that keeps sending gets a second budget
# of the same size, so it isn't crowded out by single-frame MACs.  The budget follows the
# capture's timestamps, not how fast a file is read: a pcap read at full speed still
# gets this many new devices per second recorded in it.  Each of the last 16 capture
# seconds has its own budget.  Frames dated more than a minute past the server clock
# share one budget per server second; frames dated before the last 16 seconds only admit
# MACs that were refused before.  A capture from hours earlier appended to the end
# starts the count over.  Raise it, or set 0, to keep every device
# from a capture of a large network.
wired_new_device_rate=200

# Addresses listed on a device from the IP traffic it sends ("traffic" source).  By
# default only local addresses are listed: RFC 1918 private, 100.64/10 (carrier-grade
# NAT), link-local, IPv6 ULA, and the subnets DHCP and DHCPv6 hand out (at most 32,
# each forgotten after a day without a lease).  Since anyone can send a DHCP reply, a
# public IPv4 subnet only counts at /16 or narrower, and DHCPv6 only the /64 of a global
# unicast (2000::/3) lease.  A router forwards traffic from every remote address, which
# would otherwise fill its list.  Addresses from ARP and DHCP are always listed.  Set
# true to list them all.
wired_learn_remote_ips=false

# Most IP flows (address, port, protocol and VLAN) to keep in memory; 0 turns flow
# tracking off.  About 140 bytes each (a 128 byte entry and its hash bucket).  Past 90%
# full, a new flow is only kept once a second packet of it is seen, so a scan of single
# packets can't fill the table.  Flows are kept in memory only; they're never written
# to a log.
wired_max_flows=16384

# Seconds a flow can be idle before it's forgotten: TCP, TCP after a FIN or RST, and
# UDP and other protocols.  Idle time is measured on the server clock since the flow's
# last packet arrived, so replaying an old capture doesn't expire its flows at once.
wired_flow_tcp_timeout=300
wired_flow_tcp_closed_timeout=10
wired_flow_udp_timeout=60

# Linking wired and wireless devices
#
# A Wi-Fi device and an Ethernet device with the same MAC are linked, so what the wire saw
# a wireless device do (its addresses, names, DHCP fingerprint, VLANs, sensors, traffic and
# flows) can be found from its Wi-Fi record.  The two records stay separate: a linked pair
# shares kismet.device.base.entity_id, each lists the other in its related devices, and
# /entities/by-device/<key>/linked.json shows the evidence and the other record.
#
# The relationship is wired_same_mac for a Wi-Fi client (confidence 80, 75 for a locally
# administered MAC) or an AP or WDS radio (70), and wired_bridged for a host bridged onto
# Wi-Fi: the source of from-DS frames behind a BSSID, or of 4-address frames from a WDS
# radio (70).  The same IPv4 address on both adds 10, unless the Ethernet device filled
# its IPv4 list or it's a gateway.  A Wi-Fi client heard only in probes and other
# management frames scores 45, and a Wi-Fi record that was only ever a destination 40: with
# the IPv4 bonus too they stay under the default threshold, shown as possible links, not
# linked.  No links are made for group MACs or VRRP and HSRP virtual router MACs.  Anyone
# can send frames with any MAC, so a link is evidence, not proof.
#
# Linking runs once a second on new and forgotten devices, and re-reads up to
# entity_sweep_per_tick links each pass so changes (a bridged host turning out to be a
# client, a new address) are picked up.  Links refused at a limit below are made once older
# ones go.  It costs nothing without Ethernet devices.
#
# Linking keeps an index of Ethernet MACs that holds twice wired_max_devices, or twice
# tracker_max_devices when that's lower or wired_max_devices is 0.  With both at 0 it holds
# 65536 MACs: Ethernet devices past that stay unlinked until older ones are forgotten and
# make room.
entity_linking=true

# Links at or above this confidence (1-90, the highest any link scores now) are linked;
# lower ones are possible links.
entity_link_min_confidence=60

# Most links kept; 0 turns linking off.  A link costs about 540 bytes in the link graph and
# 1.3 to 1.6 KB in all, with the entity id and related device entries on both records.
entity_max_edges=65536

# Links per device, and records joined into one entity.  Links are only between records
# with the same MAC for now, so a record has one link and an entity two records, and these
# don't apply yet.
entity_max_edges_per_device=16
entity_max_component=32

# Most changed MACs read, and links re-read, each second.
entity_max_evidence_per_tick=2048
entity_sweep_per_tick=1024

# Debugging only, for timing linking's parts alone: entity_debug_timer=false indexes devices
# but never links them, and entity_debug_removed_hook=false stops watching for forgotten
# devices, which leaves links to them until the next re-read.
# entity_debug_timer=true
# entity_debug_removed_hook=true
