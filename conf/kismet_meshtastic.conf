# Meshtastic-specific configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Number of messages to keep available per channel
meshtastic_num_messages=128

# Meshtastic channels, as meshtastic_key=channelname,base64key
#
# The channel name must exactly match the Meshtastic channel name (case sensitive,
# up to 11 characters); together with the key it forms the channel hash used to pick
# the key for each packet.
#
# Keys are the base64 PSK shown by the Meshtastic apps or in a channel URL:
#   AQ== is the default key, AA== disables encryption, and 16 or 32 byte keys
#   select AES128 or AES256.
#
# The default channel for every modem preset (LongFast, LongSlow, LongMod, LongTurbo,
# MediumFast, MediumSlow, ShortFast, ShortSlow, ShortTurbo) with the
# default key is always enabled.
meshtastic_key=HackerComms,6IzsaoVhx1ETWeWuu0dUWMLqItvYJLbRzwgTAKCfvtY=
meshtastic_key=DEFCONnect,OEu8wB3AItGBvza4YSHh+5a3LlW/dCJ+nWr7SNZMsaE=

