# Kismet filter configuration
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Various filter options for different parts of Kismet; These can be combined
# with live filter control for scripted behavior.
#
# In general, you should place filter options in kismet_site.conf as per the
# override config documentation:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# This will prevent filter options being overwritten if Kismet is upgraded.

# Nearly all the options in this file are commented out - Kismet does not do 
# filtering by default, and under typical use, users will likely not want filtering.


# Signal threshold filtering for locational information
# Kismet logs ALL packets with signal data, regardless of this option.
# With this threshold set, Kismet will not consider packets with signals weaker than this
# threshold for the running average location calculations.
#
# Signal is in dBm and applied to all packet types; packet types which do not report a 
# signal level will use all packets.
#
# A strong or weak signal may not indicate distance, enable this option with caution.
#
#device_location_signal_threshold_dbm=-65



# BTLE random MAC filtering
#
# BTLE incorporates a randomized MAC address model; devices using random MACs will 
# advertise services with a constantly-changing MAC address.  This can flood the logs
# with single-packet devices.
#
# Turning on BTLE Random filtering will *ignore btle devices with a rotating random mac*
# (resolvable and non-resolvable private addresses, which change every few minutes).
# These devices *will not be logged as devices or shown in the ui*, however their
# packets will still be logged in kismetdb and pcap.
#
# Filtering BTLE random devices will prevent a huge overflow of devices in the log and
# UI, however it will also prevent these devices from being shown.
#
# Devices with a static random address keep it until they're reset, so they're kept:
# fixed devices such as smoke alarms, sensors and beacons often use one.  Drones
# broadcasting Remote ID and known location trackers (Samsung SmartTags, Apple Find My
# accessories, Google FMDN tags and trackers sending the DULT advertisement)
# are always kept too, even though they use rotating random MACs.
#
# btle_random picks what happens to rotating random addresses:
#   track           track every one (the default)
#   hide_unmatched  track every one, and leave those whose advertising payload no
#                   other address shares out of the web UI's Default device view;
#                   this turns on btle_related
#   ignore          the filtering above; btle_ignore_random=true is the older name
#                   for it

# btle_random=track

# BTLE related devices: group rotating random addresses by their advertising payload.
# The addresses a device moves through, and identical devices, advertise the same
# payload, so addresses with the same payload are related.  Each address gets
# btle.device.related_group (shared by its related addresses),
# btle.device.related_count, and btle.device.old_address once it has gone quiet and a
# newer related address has appeared.  The btle-related-old-address and btle-related-unmatched rules in
# kismet_device_rules_highlights.txt tag and hide these.  This links addresses that
# address randomization keeps apart, so it is off by default.
#
# An address is old after btle_related_quiet seconds without being heard (default 60).
# btle.device.related_active counts the addresses in the group heard within that time,
# about how many devices with the payload are around now.
#
# Payloads whose bytes change with the address (Apple Continuity, Fast Pair, Swift
# Pair) never match exactly, so the same records, company and services with any
# changing bytes put addresses in a similar group as well: btle.device.similar_group,
# similar_count and similar_active.  Many devices of one model look alike, so similar
# groups never mark addresses old.  They have the same limits as related groups.
#
# btle_related also links each address to the one before it, as btle_link_randomized
# in kismet.conf does, unless btle_link_randomized=false.
#
# Groups are kept until a limit is reached, not by time.  At most
# btle_related_max_groups groups are tracked (default 128); past that, the group heard
# least recently is forgotten.  Each group holds at most btle_related_max_addresses
# addresses (default 64); past that, its longest quiet address is dropped and the group
# is marked with btle.device.related_truncated, since its older addresses are missing.
# Forgotten and dropped addresses keep their last group fields.

# btle_related=true
# btle_related_quiet=60
# btle_related_max_groups=128
# btle_related_max_addresses=64


# kismetdb device filtering
#
# By default, the kismetdb log does not filter; if you plan to log only
# specific devices, set the default to 'block' and set specific devices to
# 'pass'.
#
# This does NOT change PACKET logging; for that see the packet filter options

# kis_log_device_filter_default=pass

# Specific devices can be included or excluded from logging based on MAC
# address.  This will filter all devices of that MAC from the log; they
# will still be tracked, but will not be written to the log.
# kis_log_device_filter=phyname,macaddress,value
#
# MACs can be specified as single MACs or as masked MAC groups
#
# kis_log_device_filter=IEEE802.11,aa:bb:cc:dd:ee,pass
# kis_log_device_filter=IEEE802.11,11:22:33:00:00:00/FF:FF:FF:00:00:00,block
#
# To exclude (or add) an entire phy type to the logs, use the '*' wildcard for MAC addresses:
# kis_log_device_filter=802.15.4,*,pass


# kismetdb packet filtering
#
# By default, the kismetdb log does not filter; if you plan to log
# only specific packets, set the default to 'block' and set specific
# packet attributes to 'pass'.
#
# This does NOT change DEVICE logging; if you want to prevent logging 
# information about devices as well as packets, set the corresponding
# device filters.
# 

# kis_log_packet_filter_default=pass

# Packets can be included or excluded from logging based on MAC address by
# source, destination, network, or other; the exact meaning of these
# addresses depends on the PHY type.  For Wi-Fi, the 'other' address is used
# only in WDS 4-mac environments.
# Additionally, packets may be matched on 'any' address.
# Packet filters are defined as:
# kis_log_packet_filter=phyname,addresstype,macaddress,value

# kis_log_packet_filter=IEEE802.11,source,aa:bb:cc:dd:ee,pass

# Filters can also use MAC address group matches:
# kis_log_packet_filter=IEEE802.11,any,11:22:33:00:00:00/ff:ff:ff:00:00:00,block

#
# To exclude (or add) an entire phy type to the logs, use the '*' wildcard for MAC addresses:
# kis_log_packet_filter=802.15.4,any,*,pass


# Wi-Fi data frame content filtering
#
# Data frames this filter blocks are cut to their 802.11 headers before they
# are written to any log or pcap stream, the same way hidedata=true cuts every
# data frame.  Unencrypted EAPOL-Key (WPA handshake) frames are kept whole.
# Device tracking and the rest of the packet are not affected.  With
# hidedata=true this filter has no effect; every data frame is cut already.
#
# To log the contents of only some devices, set the default to 'block' and
# pass those devices:
# dot11_content_filter_default=block
# dot11_content_filter=source,aa:bb:cc:dd:ee:ff,pass
# dot11_content_filter=destination,aa:bb:cc:dd:ee:ff,pass
#
# To cut the contents of some devices and keep the rest, keep the default
# 'pass' and block them, for example everything in one network:
# dot11_content_filter=network,11:22:33:44:55:66,block
#
# Filters are defined as:
# dot11_content_filter=addresstype,macaddress,value
# with the address types source, destination, network, other (the WDS
# transmitter) and any, and MAC masks like the packet filters above.  They can
# be changed at runtime with
# /filters/packet/dot11_content/IEEE802.11/:addresstype/set_filter.cmd and
# json={"filter": {"aa:bb:cc:dd:ee:ff": true}}, where true cuts and false keeps
# the content, and the default with /filters/packet/dot11_content/set_default.cmd.

# dot11_content_filter_default=pass

