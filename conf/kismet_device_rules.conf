# Device rules configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Device rules tag, color, collect into views, and alert on devices that match them.
# The rules are written in the device rules language; see kismet_device_rules.txt for
# the syntax.
#
# Rules are read from rules files, then from directories of rules files, then from
# device_rule and device_sort lines here, in that order; the order sets which rule's
# color wins and how 'by rule' sorts.  A rule or sort with the same name as one read
# earlier from another file replaces it in its place; the same name twice in one file
# is an error.  If any rule has an error, none of the rules are loaded.
#
# Rules files, in order.  Use += in kismet_site.conf to add a file, or = to replace the
# list.  Without any, %E/kismet_device_rules.txt is read if it exists.  Rules files may
# include other files with: include "file" or include "dir/*.rules", relative to the
# including file.
#
# device_rules_file=%E/kismet_device_rules.txt
# device_rules_file+=/etc/kismet/site.rules

# Directories of rules files; every *.rules file in each is read, in natural order
# (so 2_x.rules comes before 10_x.rules).
#
# device_rules_dir=%E/device_rules.d

# A rule or sort on one line, written without its leading 'rule' or 'sort'.  Long
# rules are better kept in a rules file; config lines can't be longer than 8190
# characters.
#
# device_rule=close-apple { when manuf contains "Apple" and signal > -60 tag "close" }
# device_sort=loudest { by signal desc, packets desc }

# Leave out a rule or sort by name, such as one from a packaged rules file.
#
# device_rule_disable=close-apple
# device_sort_disable=loudest

# Rules set over the REST API (/devices/rules/set.cmd) come after all of the above, and
# replace only the rules set earlier over the API; rules from the API can't include
# files.  They're kept in memory unless saved, in which case they're written to
# device_rules_api_file and loaded again at startup.
#
# device_rules_api_save=false
# device_rules_api_file=%h/.kismet/kismet_device_rules_api.txt

# How often, in seconds, rules are checked against devices that changed since the last
# check.  Rules marked 'live' are also checked on every packet that updates a device.
#
# device_rules_interval=1

# Rules using 'now' or 'age()' can start or stop matching without the device changing;
# every this many checks, all devices are checked.  0 never checks unchanged devices.
#
# device_rules_full_interval=10

# Most DEVICERULE alerts held back by the alert rate limit at once (set with
# alert=DEVICERULE in kismet_alerts.conf); they are raised as the limit allows, and when
# the queue is full the oldest is dropped.  0 drops held-back alerts.
#
# device_rules_alert_backlog=64

# Compile rules to native code where the platform allows it (64-bit x86, ARM, RISC-V,
# PowerPC, MIPS, s390x and LoongArch).  Elsewhere, or when the system forbids generated
# code, rules run in the bytecode interpreter, with the same results.
#
# device_rules_jit=true
