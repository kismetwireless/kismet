# Device rules configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Device rules tag, color, collect into views, and alert on devices that match them.
# The rules themselves are in their own file, in the device rules language; see that
# file for the syntax.  The rules can also be replaced at runtime over the REST API,
# which does not change the file.
#
# device_rules_file=%E/kismet_device_rules.txt

# How often, in seconds, rules are checked against devices that changed since the last
# check.  Rules marked 'live' are also checked on every packet that updates a device.
#
# device_rules_interval=1

# Rules using 'now' or 'age()' can start or stop matching without the device changing;
# every this many checks, all devices are checked.  0 never checks unchanged devices.
#
# device_rules_full_interval=10

# Most DEVICERULE alerts held back by the alert rate limit at once (set with
# alert=DEVICERULE in kismet_alerts.conf); they are raised as the limit allows, and when
# the queue is full the oldest is dropped.  0 drops held-back alerts.
#
# device_rules_alert_backlog=64

# Compile rules to native code where the platform allows it (64-bit x86, ARM, RISC-V,
# PowerPC, MIPS, s390x and LoongArch).  Elsewhere, or when the system forbids generated
# code, rules run in the bytecode interpreter, with the same results.
#
# device_rules_jit=true
