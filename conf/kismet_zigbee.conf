# Zigbee (802.15.4) configuration options
#
# This configuration file is part of the Kismet configuration.  It is loaded
# by the kismet.conf main configuration file.
#
# For more information about the configuration options, see the comments in this
# file and the documentation at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/
#
# You can edit the values in these files, but to make it much easier to update Kismet
# in the future, you should put your changes in the kismet_site.conf override file.
# You can learn more about the override config at:
# https://www.kismetwireless.net/docs/readme/configuring/configfiles/#customizing-configs-with-kismet_siteconf

# Your own Zigbee keys, as zigbee_key=name,key
#
# The key is 16 octets in hex, with or without colons, as Zigbee2MQTT, ZHA, deCONZ or
# Wireshark show it.  Each key is tried after the publicly known keys on secured frames,
# as the network key (NWK security) and as a link key (APS security: the key itself, and
# the key-transport and key-load keys hashed from it).  A device whose frames match one
# reads "Zigbee: your key (name)" in the encryption column and "Your key in use" in its
# device panel; that is expected, not a weakness, so it raises no alert.
#
# Only give Kismet keys to networks you are entitled to read: with a key, Kismet can
# decrypt that network's traffic.
#
# zigbee_key=Home network,01:23:45:67:89:ab:cd:ef:01:23:45:67:89:ab:cd:ef

# Record key values (a key sent in the clear, or a publicly known network key) in device
# records, alerts and messages.  Off by default: only the key's type or name is kept, so a
# neighbouring network's key isn't stored in logs or sent to every client.
#
# zigbee_show_keys=false

# Most ZIGBEEWEAKKEY alerts held back by the alert rate limit at once; when full, the
# oldest is dropped.  0 drops held-back alerts.
#
# zigbee_alert_backlog=64
